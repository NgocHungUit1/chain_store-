<div fxLayout="row wrap" *ngIf="expensesOrder !== null" class="m-b-20">
  <div fxFlex="100">
    <h3 style="color: #009688">{{expensesOrder.name}}</h3>
  </div>
  <div fxFlex="100">
    <div fxLayout="row wrap">
      <div fxFlex="100" class="product-info">
        <div fxLayout="row wrap" class="product-info-row">
          <div fxFlex="200px">
            <span *ngIf="expensesOrder.auto == 1; else autoFalse ">
              <mat-icon color="primary">done</mat-icon> Tự động đưa vào hóa đơn
            </span>
            <ng-template #autoFalse>
              <span>
                <mat-icon color="warn">close</mat-icon>Không tự động đưa vào hóa đơn
              </span>
            </ng-template>
          </div>
          <div fxFlex="4"></div>
          <div fxFlex="200px">
            <span *ngIf="expensesOrder.return_auto == 1; else returnAutoFalse ">
              <mat-icon color="primary">done</mat-icon> Hoàn lại khi trả hàng
            </span>
            <ng-template #returnAutoFalse>
              <span> <mat-icon color="warn">close</mat-icon>Không hoàn lại khi trả hàng
              </span>
            </ng-template>
          </div>
        </div>

        <div fxLayout="row wrap" class="product-info-row">
          <div fxFlex="48" class="product-info-field">
            <span class="product-field-label">Mã thu: </span> {{ expensesOrder.no }}
          </div>
          <div fxFlex="4"></div>
          <div fxFlex="48">

          </div>
        </div>

        <div fxLayout="row wrap" class="product-info-row">
          <div fxFlex="48" class="product-info-field">
            <span class="product-field-label">Loại thu: </span> {{ expensesOrder.name }}
          </div>
          <div fxFlex="4"></div>
          <div fxFlex="48">

          </div>
        </div>

        <div fxLayout="row wrap" class="product-info-row">
          <div fxFlex="48" class="product-info-field">
            <span class="product-field-label">Giá trị: </span>
            {{ expensesOrder.value | number }}
            <span *ngIf="expensesOrder.type === 'price'">VNĐ</span>
            <span *ngIf="expensesOrder.type === 'percent'">%</span>
          </div>
          <div fxFlex="4"></div>
          <div fxFlex="48">

          </div>
        </div>

      </div>

    </div>
  </div>
  <div fxFlex="100" align="end">
    <button class="m-r-10" mat-raised-button color="primary"
            (click)="openExpensesOrderFormDialog(this.expensesOrder.id)">
      <mat-icon>edit</mat-icon>
      Cập nhật
    </button>
    <button class="m-r-10" mat-raised-button color="warn" (click)="deleteItem()">
      <mat-icon>delete</mat-icon>
      Xóa
    </button>
    <button class="m-r-10" mat-raised-button color="warn" *ngIf="this.expensesOrder.status === 10"
            (click)="updateStatus(9)">
      <mat-icon>lock</mat-icon>
      Ngừng thu
    </button>

    <button class="m-r-10" mat-raised-button color="primary" *ngIf="this.expensesOrder.status === 9"
            (click)="updateStatus(10)">
      <mat-icon>lock_open</mat-icon>
      Cho phép thu
    </button>
  </div>
</div>
