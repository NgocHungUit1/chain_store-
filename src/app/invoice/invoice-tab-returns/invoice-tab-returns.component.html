<table mat-table [dataSource]="returns" class="mat-elevation-z8">

    <ng-container matColumnDef="#">
        <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['#'] }} </th>
        <td mat-cell *matCellDef="let element; let i = index;"> {{ i + 1 }}</td>
    </ng-container>

    <ng-container matColumnDef="return_no">
        <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['return_no'] }} </th>
        <td mat-cell *matCellDef="let element"> {{element.return_no}} </td>
    </ng-container>

    <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['created_at'] }} </th>
        <td mat-cell *matCellDef="let element"> {{element.created_at * 1000 | date:'dd/M/yyyy HH:mm' }} </td>
    </ng-container>

    <ng-container matColumnDef="total_price">
        <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['total_price'] }} </th>
        <td mat-cell *matCellDef="let element"> {{ element.total_price | number }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="header-element-row"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
