<h1 mat-dialog-title>Thêm nhóm hàng</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Tên nhóm</mat-label>
      <input matInput tabindex="1" [formControl]="this.form.controls['name']">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Nhóm cha</mat-label>
      <mat-select tabindex="2" [formControl]="this.form.controls['parent_id']">
        <mat-option *ngFor="let parent of parentList" [value]="parent.id">
          {{parent.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    </form>
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="3" (click)="submit()"><mat-icon>save</mat-icon>Lưu</button>
  <button mat-button (click)="onNoClick()" tabindex="-1"><mat-icon>cancel</mat-icon>Bỏ qua</button>
</div>
