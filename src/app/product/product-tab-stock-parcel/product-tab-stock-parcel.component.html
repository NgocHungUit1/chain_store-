<table mat-table [dataSource]="parcelDataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="#">
    <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['#'] }} </th>
    <td mat-cell *matCellDef="let element; let i = index;"> {{ i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="parcel_no">
    <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['parcel_no'] }} </th>
    <td mat-cell *matCellDef="let element"> {{ element.parcel_no }} </td>
  </ng-container>

  <ng-container matColumnDef="quantity_of_stock">
    <th mat-header-cell class="column-number" *matHeaderCellDef> {{ columnsHeader['quantity_of_stock'] }} </th>
    <td mat-cell class="column-number bold-text"
        *matCellDef="let element">
      <span>
        {{  element.quantity_of_stock | number : '0.0-0' }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="expiration_date">
    <th mat-header-cell *matHeaderCellDef> {{ columnsHeader['expiration_date'] }} </th>
    <td mat-cell *matCellDef="let element"> {{ element.expiration_date }} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let element">
      <button class="m-l-10" mat-raised-button color="primary" [disabled]="!canDo('Warehouse-Product-Parcel.Update')"
              (click)="openChangeWarehouseProductStockFormDialog(element.id)">
        <mat-icon>edit</mat-icon>
        Cập nhật tồn kho
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns" class="header-element-row"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator #paginator [length]="pageTotalCount" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
               (page)="onMatPageChange($event)" [pageIndex]="page - 1" showFirstLastButtons></mat-paginator>
<br>
