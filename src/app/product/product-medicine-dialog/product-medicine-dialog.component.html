<h2 mat-dialog-title><strong>{{title}}</strong></h2>
<form #userForm="ngForm" [formGroup]="form">
  <mat-dialog-content class="mat-typography">
    <mat-tab-group>
      <mat-tab label="Thông tin">
        <div fxLayout="row wrap">
          <div fxFlex="100">
            <div class="process-bar-container m-t-10 m-b-10" *ngIf="loading" style="height: 10px">
              <mat-progress-bar mode="query"></mat-progress-bar>
            </div>
          </div>
          <!-- Card column -->
          <div fxFlex.gt-sm="58%" fxFlex="100">
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['product_no']" placeholder="Mã hàng">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['barcode']" placeholder="Mã vạch">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['product_name']" placeholder="Tên thuốc">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['shortcut']" placeholder="Tên viết tắt">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Nhóm" [formControl]="form.controls['group_id']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let group of groups" [value]="group.id">
                      {{group.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['group_id'].hasError('required')">Vui lòng chọn nhóm</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openGroupFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Đường dùng" [formControl]="form.controls['using_id']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let using of usings" [value]="using.id">
                      {{using.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['using_id'].hasError('required')">Vui lòng chọn đường dùng</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openGroupFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Vị trí" multiple [formControl]="form.controls['placements']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let placement of placements" [value]="placement.id">
                      {{placement.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['placements'].hasError('required')">Vui lòng chọn đường dùng</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openGroupFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>

          </div>
          <div fxFlex.gt-sm="2%" fxFlex="100"></div>
          <div fxFlex.gt-sm="40%" fxFlex="100">
            <mat-form-field>
              <input type="text" matInput [formControl]="form.controls['original_price']" placeholder="Giá vốn">
            </mat-form-field>
            <mat-form-field>
              <input type="text" matInput [formControl]="form.controls['sell_price']" placeholder="Giá bán">
            </mat-form-field>
            <mat-form-field>
              <input type="text" matInput [formControl]="form.controls['weight']" placeholder="Trọng lượng">
            </mat-form-field>
          </div>
        </div>

      </mat-tab>
      <mat-tab label="Mô tả chi tiết">
        <mat-card-content></mat-card-content>
      </mat-tab>
    </mat-tab-group>
  </mat-dialog-content>
  <div mat-dialog-actions align="end">
    <button mat-button [disabled]="loading" (click)="submit();" mat-flat-button color="warn">{{action}}</button>
    <button mat-button type="button" (click)="closeDialog()">Bỏ qua</button>
  </div>
</form>
