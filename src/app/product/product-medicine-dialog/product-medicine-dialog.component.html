<h2 mat-dialog-title><strong>{{title}}</strong></h2>
<form #userForm="ngForm" [formGroup]="form">
  <mat-dialog-content class="mat-typography">
    <mat-tab-group>
      <mat-tab label="Thông tin">
        <div fxLayout="row wrap">
          <div fxFlex="100">
            <div class="process-bar-container m-t-10 m-b-10" *ngIf="loading" style="height: 10px">
              <mat-progress-bar mode="query"></mat-progress-bar>
            </div>
          </div>
          <!-- Card column -->
          <div fxFlex.gt-sm="58%" fxFlex="100">
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['product_no']" placeholder="Mã hàng">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['barcode']" placeholder="Mã vạch">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['product_name']" placeholder="Tên thuốc" [matAutocomplete]="auto">
                  <button mat-icon-button matPrefix><mat-icon>search</mat-icon></button>
                  <button mat-icon-button matSuffix (click)="removeMedicine()" *ngIf="this.form.controls['product_name'].value">
                    <mat-icon>delete</mat-icon>
                  </button>
                  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectedMedicine($event.option.value)">
                    <mat-option *ngFor="let medicine of filteredMedicines | async" [value]="medicine">
                      {{medicine.medicine_name}}
                    </mat-option>
                  </mat-autocomplete>
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['shortcut']" placeholder="Tên viết tắt">
                </mat-form-field>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Nhóm" [formControl]="form.controls['group_id']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let group of groups" [value]="group.id">
                      {{group.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['group_id'].hasError('required')">Vui lòng chọn nhóm</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openGroupFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Đường dùng" [formControl]="form.controls['using_id']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let using of usings" [value]="using.id">
                      {{using.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['using_id'].hasError('required')">Vui lòng chọn đường dùng</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openUsingFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>
            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Vị trí" multiple [formControl]="form.controls['placements']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let placement of placements" [value]="placement.id">
                      {{placement.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['placements'].hasError('required')">Vui lòng chọn đường dùng</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openPlacementFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>

          </div>
          <div fxFlex.gt-sm="2%" fxFlex="100"></div>
          <div fxFlex.gt-sm="40%" fxFlex="100">
            <mat-form-field>
              <input type="number" matInput [formControl]="form.controls['original_price']" placeholder="Giá vốn">
            </mat-form-field>
            <mat-form-field>
              <input type="number" matInput [formControl]="form.controls['sell_price']" placeholder="Giá bán">
            </mat-form-field>
            <mat-form-field>
              <input type="number" matInput [formControl]="form.controls['weight']" placeholder="Trọng lượng">
            </mat-form-field>
          </div>

          <div fxFlex="100">

          </div>

          <div fxFlex="100">
            <mat-card style="margin: 0px; border: 1px solid #ccc">
              <mat-card-content formGroupName="medicine">
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput formControlName="registration_no" placeholder="Số đăng ký">
                    </mat-form-field>
                  </div>
                </div>
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput formControlName="main_active_substance" placeholder="Hoạt chất">
                    </mat-form-field>
                  </div>
                </div>
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput formControlName="content" placeholder="Hàm lượng">
                    </mat-form-field>
                  </div>
                </div>
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput formControlName="packing" placeholder="Quy cách đóng gói">
                    </mat-form-field>
                  </div>
                </div>
                <div fxLayout="row wrap">
                  <div fxFlex="90">
                    <mat-form-field>
                      <mat-select placeholder="Hãng sản xuất" formControlName="manufacturer">
                        <mat-option>--</mat-option>
                        <mat-option *ngFor="let manufacturer of manufacturers" [value]="manufacturer.id">
                          {{manufacturer.name}}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                  <div fxFlex="10">
                    <button mat-button aria-label="add" (click)="openPlacementFormDialog()">
                      <mat-icon>add</mat-icon>
                    </button>
                  </div>
                </div>
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <input type="text" matInput formControlName="made_in" placeholder="Nước sản xuất">
                    </mat-form-field>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </div>

          <br>

          <div fxFlex="100">
            <mat-card style="margin: 10px 0px; border: 1px solid #ccc">
              <mat-card-content>
                <div fxLayout="row wrap">
                  <div fxFlex="30">
                    <mat-form-field>
                      <input type="text" matInput [formControl]="form.controls['base_unit']" placeholder="Đơn vị cơ bản">
                    </mat-form-field>
                  </div>
                </div>

                <div fxLayout="row wrap" *ngIf="units.length > 0">
                  <div fxFlex="100">
                    <ng-container formArrayName="units">
                      <table>
                        <thead style="text-align: left">
                          <th>Tên đơn vị</th>
                          <th>Giá trị quy đổi</th>
                          <th>Giá bán</th>
                          <th>Mã hàng</th>
                          <th></th>
                        </thead>
                        <tbody>
                          <tr *ngFor="let _ of units.controls; index as i;">
                            <ng-container [formGroupName]="i">
                              <td>
                                <mat-form-field>
                                  <input type="text" formControlName="unit_name" matInput placeholder="Tên đơn vị">
                                </mat-form-field>
                              </td>
                              <td>
                                <mat-form-field>
                                  <input type="number" formControlName="unit_value" matInput placeholder="Giá trị quy đổi">
                                </mat-form-field>
                              </td>
                              <td>
                                <mat-form-field>
                                  <input type="number" formControlName="unit_price" matInput placeholder="Giá bán">
                                </mat-form-field>
                              </td>
                              <td>
                                <mat-form-field>
                                  <input type="text" formControlName="unit_no" matInput placeholder="Mã hàng">
                                </mat-form-field>
                              </td>
                              <td>
                                <a (click)="removeUnit(i)"><mat-icon>delete</mat-icon></a>
                              </td>
                            </ng-container>
                          </tr>
                        </tbody>
                      </table>
                    </ng-container>
                  </div>
                </div>

                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <button mat-raised-button (click)="addUnit();" [disabled]="!form.controls['base_unit'].value"><mat-icon>add</mat-icon>Thêm đơn vị</button>
                  </div>
                </div>


              </mat-card-content>
            </mat-card>
          </div>
        </div>

      </mat-tab>
      <mat-tab label="Mô tả chi tiết">
        <mat-card-content></mat-card-content>
      </mat-tab>
    </mat-tab-group>
  </mat-dialog-content>
  <div mat-dialog-actions align="end">
    <button mat-button [disabled]="loading" (click)="submit();" mat-flat-button color="warn">{{action}}</button>
    <button mat-button type="button" (click)="closeDialog()">Bỏ qua</button>
  </div>
</form>
