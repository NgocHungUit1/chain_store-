<h2 mat-dialog-title><strong>{{title}}</strong></h2>
<form #userForm="ngForm" [formGroup]="form" >
  <mat-dialog-content class="mat-typography product-dialog">
    <mat-tab-group>
      <!-- Tab thong tin  -->
      <mat-tab label="Thông tin">
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex="100">
            <div class="process-bar-container m-t-10 m-b-10" *ngIf="loading" style="height: 10px">
              <mat-progress-bar mode="query"></mat-progress-bar>
            </div>
          </div>
          <!-- Card column -->
          <div fxFlex.gt-sm="58%" fxFlex="100">

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text"  matInput [formControl]="form.controls['product_no']" placeholder="Mã hàng hóa">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text"  matInput [formControl]="form.controls['product_name']" placeholder="Tên hàng">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Nhóm" [formControl]="form.controls['group_id']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let group of groups" [value]="group.id">
                      {{group.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['group_id'].hasError('required')">Vui lòng chọn nhóm</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openGroupFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="number"  matInput [formControl]="form.controls['original_price']" placeholder="Giá vốn">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="number"  matInput [formControl]="form.controls['sell_price']" placeholder="Giá gốc">
                </mat-form-field>
              </div>
            </div>
          </div>
          <div fxFlex.gt-sm="2%" fxFlex="100"></div>
<!-- Hình ảnh -->
          <div fxFlex.gt-sm="40%" fxFlex="100">
            40
          </div>


        </div>

      </mat-tab>

      <!-- Tab mo ta chi tiet  -->
      <mat-tab label="Mô tả chi tiết">
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex="100">
            <mat-card style="margin: 0px; border: 1px solid #ccc">
              <mat-card-content>
                <div fxLayout="row wrap">
                  <div fxFlex="50">
                    <mat-form-field>
                      <input type="number" matInput formControlName="min_quantity" placeholder="Định mức tồn tối thiểu">
                    </mat-form-field>
                  </div>
                  <div fxFlex="50">
                    <mat-form-field>
                      <input type="number" matInput formControlName="max_quantity" placeholder="Định mức tồn tối đa">
                    </mat-form-field>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex="100">
            <quill-editor formControlName="description" placeholder="Mô tả" [style]="{height: '200px'}"></quill-editor>
          </div>
        </div>
        <div fxLayout="row wrap" style="margin-top: 85px;">
          <div fxFlex="100">
            <mat-card style="margin: 0px; border: 1px solid #ccc">
              <mat-card-content>
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <textarea matInput formControlName="note" placeholder="Mẫu ghi chú (hóa đơn, đặt hàng)"></textarea>
                    </mat-form-field>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
      </mat-tab>

      <!-- Tab Món thêm  -->
      <mat-tab label="Món thêm">

      </mat-tab>
    </mat-tab-group>
  </mat-dialog-content>
  <div mat-dialog-actions align="end">
    <button mat-raised-button [disabled]="loading" (click)="submit('Save')"  mat-flat-button color="primary">
      <mat-icon>save</mat-icon> Lưu
    </button>
    <button mat-raised-button [disabled]="loading"  mat-flat-button color="primary">
      <mat-icon>save</mat-icon> Lưu và Thêm mới
    </button>
    <button mat-raised-button [disabled]="loading"  mat-flat-button color="primary">
      <mat-icon>save</mat-icon> Lưu và Sao chép
    </button>
    <button mat-button type="button" (click)="closeDialog()">Bỏ qua</button>
  </div>
</form>
