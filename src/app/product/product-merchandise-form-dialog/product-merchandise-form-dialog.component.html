<h2 mat-dialog-title><strong>{{title}}</strong></h2>
<form #userForm="ngForm" [formGroup]="form">
  <mat-dialog-content class="mat-typography product-dialog">
    <mat-tab-group>
      <!-- Tab thong tin  -->
      <mat-tab label="Thông tin">
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex="100">
            <div class="process-bar-container m-t-10 m-b-10" *ngIf="loading" style="height: 10px">
              <mat-progress-bar mode="query"></mat-progress-bar>
            </div>
          </div>
          <!-- Card column -->
          <div fxFlex.gt-sm="58%" fxFlex="100">

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['product_no']" required
                         placeholder="Mã hàng hóa">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['product_name']"
                         required placeholder="Tên hàng" autocomplete="off">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['original_price']"
                         class="text-right"
                         (keyup)="inputformatNumber($event)" placeholder="Giá vốn" autocomplete="off">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="100">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['sell_price']"
                         class="text-right"
                         (keyup)="inputformatNumber($event)" required placeholder="Giá bán cơ bản" autocomplete="off">
                </mat-form-field>
              </div>
            </div>

            <div fxLayout="row wrap">
              <div fxFlex="50">
                <mat-form-field>
                  <input type="text" matInput [formControl]="form.controls['base_unit']" required
                         placeholder="Đơn vị cơ bản" autocomplete="off">
                </mat-form-field>
                <mat-chip-list #chipList>
                  <mat-chip *ngFor="let unit of filterUnit; index as i;"
                            color="{{unit.selelected==true ? 'primary' : 'null'}}"
                            selected="{{ unit.selected }}"
                            (click)="selectBaseUnit(unit.name, i)">
                    {{ unit.name }}
                  </mat-chip>
                </mat-chip-list>
              </div>

              <div fxFlex="2">
              </div>

              <div fxFlex="40">
                <mat-form-field>
                  <input type="text" class="text-right" (keyup)="inputformatNumber($event)" matInput
                         [formControl]="form.controls['quantity_of_stock']"
                         placeholder="Tồn kho (đơn vị cơ bản)" autocomplete="off">
                </mat-form-field>
              </div>
            </div>


            <!--            <div fxLayout="row wrap">-->
            <!--              <div fxFlex="100">-->
            <!--                <mat-form-field>-->
            <!--                  <input type="number" matInput [formControl]="form.controls['quantity_of_stock']"-->
            <!--                    placeholder="Tồn kho">-->
            <!--                </mat-form-field>-->
            <!--              </div>-->
            <!--            </div>-->


          </div>

          <div fxFlex.gt-sm="2%" fxFlex="100"></div>

          <!-- Hình ảnh -->
          <div fxFlex.gt-sm="40%" fxFlex="100">
            <div fxLayout="row wrap">
              <input type="file" id="file-input" #imageInput accept="image/*" (change)="processFile(imageInput)"
                     style="display: none">
              <ul class="product-upload-image">
                <li class="show selected-image" *ngFor="let image of selectedFiles; index as i"
                    [id]="'selected-image-'+i">
                  <!--<label>-->
                  <!--<span class="add-image-text"></span>-->
                  <img [src]="image.src">
                  <a class="delete-image" (click)="removeSelectedImage(i)" title="Xóa ảnh">
                    <mat-icon>remove_circle_outline</mat-icon>
                  </a>
                  <!--</label>-->
                </li>
                <li *ngFor="let imgBtn of imageButtons; index as i;" [class]="imageButtons[i]['isShow'] ? 'show' : ''">
                  <label for="file-input">
                    <span class="add-image-text">+ Thêm</span>
                    <img src="/assets/images/default-product-img.jpg">
                  </label>
                </li>
              </ul>
            </div>
          </div>
          <!-- end Hình ảnh -->

        </div>

        <div fxLayout="row wrap" class="m-t-20">

          <div fxFlex.gt-sm="100%" fxFlex="100">

            <!-- theo dõi thuoc tinh mau sac -->

            <!-- end theo dõi thuoc tinh mau sac -->

            <!-- Start Unit -->
            <div fxLayout="row wrap">

              <div fxFlex="100">

                <mat-accordion>
                  <mat-expansion-panel [expanded]="true" style="margin: 10px 0px; border: 1px solid #ccc">
                    <mat-expansion-panel-header>
                      <mat-panel-title class="custom-mat-panel-title-description">
                        Đơn vị tính
                      </mat-panel-title>
                      <mat-panel-description class="custom-mat-panel-title-description">

                      </mat-panel-description>
                    </mat-expansion-panel-header>


                    <div fxLayout="row wrap" *ngIf="units.length > 0">
                      <div fxFlex="100">
                        <ng-container formArrayName="units">
                          <table>
                            <thead style="text-align: left">
                            <th></th>
                            <th>Tên đơn vị</th>
                            <th>Giá trị quy đổi</th>
                            <th>Giá bán</th>
                            <th>Mã hàng</th>
                            <th></th>
                            </thead>
                            <tbody>
                            <tr *ngFor="let _ of units.controls; index as i;">
                              <ng-container [formGroupName]="i">
                                <td>
                                  <mat-radio-group (change)="_convertIndex = i" name="convert_base_unit">
                                    <mat-radio-button value="{{i}}"></mat-radio-button>
                                  </mat-radio-group>
                                </td>
                                <td>
                                  <mat-form-field style="width: 110px">
                                    <input type="text" formControlName="unit_name" matInput placeholder="Tên đơn vị">
                                  </mat-form-field>
                                </td>
                                <td>
                                  <mat-form-field style="width: 110px">
                                    <input type="text" formControlName="unit_value" matInput
                                           class="text-right" min="0"
                                           (change)="changeUnitValue($event,i)"
                                           (keyup)="changeUnitValue($event,i)"
                                           placeholder="Giá trị quy đổi">
                                  </mat-form-field>
                                </td>
                                <td>
                                  <mat-form-field style="width: 110px">
                                    <input type="text" formControlName="unit_price"
                                           (change)="changeBaseUnitValue($event, i)"
                                           (keyup)="changeBaseUnitValue($event, i)"
                                           class="text-right"
                                           matInput placeholder="Giá bán">
                                  </mat-form-field>
                                </td>
                                <td>
                                  <mat-form-field style="width: 120px">
                                    <input type="text" formControlName="unit_no"
                                           class="text-center"
                                           matInput placeholder="Mã hàng">
                                  </mat-form-field>
                                </td>
                                <td>
                                  <a (click)="removeUnit(i)">
                                    <mat-icon>delete</mat-icon>
                                  </a>
                                </td>
                              </ng-container>
                            </tr>
                            </tbody>
                          </table>
                        </ng-container>
                      </div>
                    </div>

                    <div fxLayout="row wrap">
                      <div fxFlex="100">
                        <p *ngIf="form.controls['base_unit'].value == null">Chưa nhập đơn vị cơ bản </p>
                        <button mat-raised-button (click)="addUnit();" [disabled]="!form.controls['base_unit'].value">
                          <mat-icon>add</mat-icon>
                          Thêm đơn vị
                        </button>
                      </div>
                    </div>


                  </mat-expansion-panel>

                </mat-accordion>


              </div>
            </div>

            <!-- End Unit -->

          </div>

        </div>


      </mat-tab>

      <!-- Tab mo ta chi tiet  -->
      <mat-tab label="Chi tiết hàng hóa">
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex.gt-sm="49%" fxFlex="100">

            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Nhóm " [formControl]="form.controls['group_id']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let group of groups" [value]="group.id">
                      {{group.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['group_id'].hasError('required')">Vui lòng chọn nhóm</mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openGroupFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>

          </div>

          <div fxFlex.gt-sm="2%" fxFlex="100">
          </div>

          <div fxFlex.gt-sm="49%" fxFlex="100">

            <div fxLayout="row wrap">
              <div fxFlex="90">
                <mat-form-field>
                  <mat-select placeholder="Vị trí" multiple [formControl]="form.controls['placements']">
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let placement of placements" [value]="placement.id">
                      {{placement.name}}
                    </mat-option>
                  </mat-select>

                  <mat-error *ngIf="form.controls['placements'].hasError('required')">Vui lòng chọn đường dùng
                  </mat-error>
                </mat-form-field>
              </div>
              <div fxFlex="10">
                <button mat-button aria-label="add" (click)="openPlacementFormDialog()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </div>

          </div>

        </div>
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex="100">
            <mat-card style="margin: 0px; border: 1px solid #ccc">
              <mat-card-content>
                <div fxLayout="row wrap">
                  <div fxFlex="50">
                    <mat-form-field>
                      <input type="number" matInput formControlName="min_quantity" placeholder="Định mức tồn tối thiểu">
                    </mat-form-field>
                  </div>
                  <div fxFlex="50">
                    <mat-form-field>
                      <input type="number" matInput formControlName="max_quantity" placeholder="Định mức tồn tối đa">
                    </mat-form-field>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
        <div fxLayout="row wrap" class="m-t-20">
          <div fxFlex="100">
            <quill-editor formControlName="description" placeholder="Mô tả" [style]="{height: '200px'}"></quill-editor>
          </div>
        </div>
        <div fxLayout="row wrap" style="margin-top: 85px;">
          <div fxFlex="100">
            <mat-card style="margin: 0px; border: 1px solid #ccc">
              <mat-card-content>
                <div fxLayout="row wrap">
                  <div fxFlex="100">
                    <mat-form-field>
                      <textarea matInput formControlName="note"
                                placeholder="Mẫu ghi chú (hóa đơn, đặt hàng)"></textarea>
                    </mat-form-field>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
      </mat-tab>

      <!-- Tab Món thêm  -->
      <mat-tab label="Món thêm">

      </mat-tab>
    </mat-tab-group>
  </mat-dialog-content>
  <div mat-dialog-actions align="end">
    <button mat-raised-button [disabled]="loading" (click)="submit('Save')" mat-flat-button color="primary">
      <mat-icon>save</mat-icon>
      Lưu
    </button>

<!--    <button mat-raised-button [disabled]="loading" mat-flat-button color="primary">-->
<!--      <mat-icon>save</mat-icon>-->
<!--      Lưu và Thêm mới-->
<!--    </button>-->
<!--    -->
<!--    <button mat-raised-button [disabled]="loading" mat-flat-button color="primary">-->
<!--      <mat-icon>save</mat-icon>-->
<!--      Lưu và Sao chép-->
<!--    </button>-->

    <button mat-raised-button type="button" (click)="closeDialog()">
      <mat-icon>cancel</mat-icon>
      Bỏ qua
    </button>
  </div>
</form>
