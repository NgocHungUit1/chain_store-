<div class="table-container">
  <div class="table-loading-shade" *ngIf="isLoadingResults || isRateLimitReached">
    <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
    <div class="table-rate-limit-reached" *ngIf="isRateLimitReached">
      GitHub's API rate limit has been reached. It will be reset in one minute.
    </div>
  </div>
  <div class=" table-responsive">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="name">
        <th mat-header-cell
            *matHeaderCellDef> {{columnsHeader['name']}}</th>
        <td mat-cell *matCellDef="let element">
                  <span>
                    {{element?.name }}
                  </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="commission_amount">
        <th mat-header-cell class="column-number"
            *matHeaderCellDef> {{columnsHeader['commission_amount']}}</th>
        <td mat-cell class="column-number" *matCellDef="let element">
                  <span>
                    {{ element?.commission_amount | number }}
                  </span>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let ba; columns: columnsToDisplay"></tr>
    </table>
  </div>
</div>
<mat-paginator #paginator showFirstLastButtons [length]="pageTotalCount"
               [pageSize]="pageSize"
               [pageSizeOptions]="pageSizeOptions"
               (page)="onMatPageChange($event)"
               [pageIndex]="page - 1"

>
</mat-paginator>
