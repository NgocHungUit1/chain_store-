<h1 mat-dialog-title *ngIf="productParcelId !== null && productParcelId !== undefined">Cập nhật tồn kho<ng-container *ngIf="lot"> lô {{ lot.parcel_no }}</ng-container></h1>
<p class="lot-hint" *ngIf="lot">
  Hạn dùng {{ lot.expiration_date | date:'dd/MM/yyyy' }} · đang có {{ lot.quantity_of_stock | number }}. Nhập tồn thực tế của cả lô ở chi nhánh này;
  phần chênh lệch ghi vào thẻ kho như kiểm kho.
</p>
<div mat-dialog-content>
  <form [formGroup]="form">
    <div fxLayout="row">
      <div fxLayout="row wrap">
        <div fxFlex="100">
          <div fxLayout="row wrap">
            <div fxFlex="100">
              <mat-form-field>
                <mat-label>Tồn kho</mat-label>
                <input matInput tabindex="1" formControlName="quantity_of_stock" required>
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
    </div>

  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary"  tabindex="14" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
