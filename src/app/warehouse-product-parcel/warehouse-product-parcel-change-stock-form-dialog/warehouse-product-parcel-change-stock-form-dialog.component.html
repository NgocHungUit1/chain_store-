<h1 mat-dialog-title *ngIf="productParcelId !== null && productParcelId !== undefined">Cập nhật tồn kho</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <div fxLayout="row">
      <div fxLayout="row wrap">
        <div fxFlex="100">
          <div fxLayout="row wrap">
            <div fxFlex="100">
              <mat-form-field>
                <mat-label>Tồn kho</mat-label>
                <input matInput tabindex="1" formControlName="quantity_of_stock" required>
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
    </div>

  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary"  tabindex="14" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
