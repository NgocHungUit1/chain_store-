<h1 mat-dialog-title *ngIf="!(group_id !== null && group_id !== undefined)">Thông tin nhóm hàng</h1>

            </div>

            <!-- Thêm checkbox "Loại đặc biệt" -->

<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary"  tabindex="14" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
