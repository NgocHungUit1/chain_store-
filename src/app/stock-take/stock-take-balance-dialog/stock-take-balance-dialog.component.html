<h2 mat-dialog-title><strong>{{title}}</strong></h2>
<h5 [innerHTML]="content"></h5>
<button class="m-r-10" mat-stroked-button color="primary" (click)="submit()">
  <mat-icon>done</mat-icon> Đồng ý
</button>

<button class="m-r-10" mat-stroked-button color="grey" (click)="closeDialog()">
  <mat-icon>cancel</mat-icon>Bỏ qua
</button>
