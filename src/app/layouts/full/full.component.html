<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div class="main-container" [dir]="dir"
     [ngClass]="{'minisidebar': minisidebar, 'boxed': boxed, 'danger': danger, 'blue': blue, 'green': green, 'dark': dark, 'sidebar-opened': sidebarOpened, 'sidebar-closed': !sidebarOpened }">
  <!-- ============================================================== -->
  <!-- Topbar - style you can find in header.scss -->
  <!-- ==============================================================
    *ngIf="this.router.url !== '/sale'"
    -->
  <mat-toolbar color="primary" class="topbar telative">
    <!-- ============================================================== -->
    <!-- Logo - style you can find in header.scss -->
    <!-- ============================================================== -->
    <div class="navbar-header">
      <a class="navbar-brand m-l-10" href="/">
        <!-- Logo icon -->
        <b>
          <!--You can put here icon as well logo-rx20.png // <i class="wi wi-sunset"></i> //-->
          <!-- Dark Logo icon -->
          <img src="{{logo}}" height="50" width="50" alt="homepage" class="dark-logo">
          <!-- Light Logo icon -->
          <img src="{{logo}}" height="50" width="50" alt="homepage" class="light-logo">
        </b>
        <!--End Logo icon -->
        <!-- Logo text -->
        <span class="logo-text" fxshow="false" fxshow.gt-xs="" style="display: block; ">
          {{ name_store }} </span>
      </a>
    </div>
    <!-- ============================================================== -->
    <!-- sidebar toggle -->
    <!-- ============================================================== -->

    <button mat-icon-button (click)="snav.toggle()" fxShow.sm="true" fxShow.xs="true" fxShow.gt-lg="false"
            fxShow="false">
      <mat-icon>menu</mat-icon>
    </button>
    <!-- ============================================================== -->
    <!-- Search - style you can find in header.scss -->
    <!-- ============================================================== -->
    <!--<button mat-icon-button class="srh-btn" (click)="showSearch = !showSearch">-->

    <!--</button>-->

    <!--<a class="cl-srh-btn" (click)="showSearch = !showSearch">-->
    <!--<i class="ti-close"></i>-->
    <!--</a>-->
    <!--</form>-->

    <span fxFlex></span>
    <div style="width: 180px; text-align: right;">
      <button mat-button style="padding-left: 0px; padding-right: 0px; " (click)="clickHelp()">
        <mat-icon>help</mat-icon>
        Hướng dẫn sử dụng
      </button>

<!--      <button mat-button [matMenuTriggerFor]="menuDownload">-->
<!--        <mat-icon>cloud_download</mat-icon>-->
<!--        Tải công cụ hổ trợ-->
<!--      </button>-->
<!--      <mat-menu #menuDownload="matMenu">-->

<!--        <button (click)="clickVideoInstallDriver()" mat-menu-item><mat-icon>video_library</mat-icon>Hướng dẫn cài đặt Driver</button>-->
<!--        <button (click)="clickVideoUseBill()" mat-menu-item><mat-icon>video_library</mat-icon>Dùng máy in bill - mã vạch</button>-->
<!--      </mat-menu>-->
    </div>
    <div style="width: 200px;">
      <mat-form-field class="branch-list" style="margin-bottom: 3px;">
        <mat-select style="font-size: 16px;" tabindex="10" (selectionChange)="changeBranch($event)"
                    [value]="branchLoginId">
          <mat-option *ngFor="let item of branchList" [value]="item.id">
            {{item.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- ============================================================== -->
    <!-- app header component - style you can find in header.scss / header.component.ts-->
    <!-- ============================================================== -->
    <app-header></app-header>
    <!-- ============================================================== -->
    <!-- Right sidebar toggle - style you can find in rightsidebar.component.scss -->
    <!-- ============================================================== -->
    <button (click)="end.toggle()" mat-icon-button class="ml-xs overflow-visible">
      <mat-icon>settings</mat-icon>
    </button>
  </mat-toolbar>
  <!-- ============================================================== -->
  <!-- End Topbar - style you can find in pages.scss -->
  <!-- ============================================================== -->
  <mat-sidenav-container class="example-sidenav-container" [style.marginTop.px]="mobileQuery.matches ? 0 : 0"
                         [ngClass]="{'minisidebar': minisidebar}">
    <!-- ============================================================== -->
    <!-- Sidebar - style you can find in sidebar.scss -->
    <!-- ============================================================== -->
    <mat-sidenav #snav id="snav" [mode]="mobileQuery.matches ? 'side' : 'over'" fixedTopGap="0"
                 [opened]="mobileQuery.matches" [disableClose]="mobileQuery.matches" (open)="sidebarOpened = true"

    <!-- ============================================================== -->
    <!-- ============================================================== -->

</div>
