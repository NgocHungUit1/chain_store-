<h1 mat-dialog-title>Lập phiếu thu</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <div fxLayout="row">

      <div fxFlex="48">

        <div fxLayout="row wrap">
          <div fxFlex="100">
            <mat-form-field>
              <input type="text" matInput [formControl]="form.controls['no']"
                     required placeholder="Mã phiếu tự động">
              <mat-hint>Từ 5 đến 20 ký tự !</mat-hint>
            </mat-form-field>
          </div>

          <div fxFlex="100">
            <div fxLayout="row">
              <div fxFlex="50">
                <mat-form-field>
                  <mat-label>Ngày</mat-label>
                  <input class="input-search" matInput [matDatepicker]="date_picker" formControlName="today"
                         required="required">
                  <mat-datepicker-toggle matSuffix [for]="date_picker"></mat-datepicker-toggle>
                  <mat-datepicker #date_picker></mat-datepicker>
                </mat-form-field>
              </div>
              <div fxFlex="2">
              </div>
              <div fxFlex="48">
                <mat-form-field>
                  <mat-label>Thời gian</mat-label>
                  <input matInput formControlName="time" type="time"
                         required="required">
                </mat-form-field>
              </div>
            </div>

          </div>

          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Loại tiền</mat-label>
              <mat-select formControlName="type_money">
                <mat-option value="money">Tiền mặt</mat-option>
                <mat-option value="bank">Ngân hàng</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div fxFlex="100">
            <mat-form-field>
              <input style="text-align: right;"
                     type="text" (keyup)="inputformatNumber($event)" matInput
                     formControlName="value" autocomplete="off"
                     required placeholder="Giá trị">
            </mat-form-field>
          </div>

          <div fxFlex="100">
            <mat-form-field>
                  <textarea type="text" matInput formControlName="note"
                            placeholder="Ghi chú"></textarea>
            </mat-form-field>
          </div>

        </div>


      </div>

      <div fxFlex="4"></div>
      <div fxFlex="48">
        <div fxLayout="row wrap">

          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Loại thu</mat-label>
              <mat-select required formControlName="method">
                <mat-option *ngFor="let value of methodValues" [value]="value">{{ methodLabels[value] }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Đối tượng nộp</mat-label>
              <mat-select required formControlName="doi_tuong_nop">
                <mat-option *ngFor="let value of doi_tuong_nop_value" [value]="value">{{ doi_tuong_nop_label[value] }}
                </mat-option>
              </mat-select>
            </mat-form-field>

          </div>

          <div fxFlex="100">
            <mat-form-field>
              <input
                class="input-search-customer input-search"
                type="text"
                formControlName="ten_nguoi_nop"
                matInput
                [matAutocomplete]="chooseNguoiNop"
                placeholder="Người nộp"
                [readonly]="this.cash_flow_id !== null && this.cash_flow_id !== undefined"
                #customerSearch />
              <button mat-icon-button matPrefix>
                <mat-icon>search</mat-icon>
              </button>
              <mat-autocomplete
                #chooseNguoiNop="matAutocomplete"
                (optionSelected)="
                          onSelectedCustomer($event.option.value)
                        ">
                <mat-option
                  *ngFor="let customer of filteredCustomers | async"
                  [value]="customer">
                          <span
                          >{{ customer.name }} -
                            <small>{{ customer.phone }}</small></span
                          >
                </mat-option>
              </mat-autocomplete>
              <button
                *ngIf="isSelectedCustomer"
                mat-icon-button
                matSuffix
                (click)="removeCustomer()"
              >
                <mat-icon>close</mat-icon>
              </button>
            </mat-form-field>
          </div>


        </div>
      </div>
    </div>

  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="14" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
