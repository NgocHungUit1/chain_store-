<h1 mat-dialog-title>Thêm bảng giá</h1>
<div mat-dialog-content>
  <div [formGroup]="form">
    <mat-form-field>
      <mat-label>Tên bảng giá</mat-label>
      <input matInput tabindex="1" formControlName="name" >
    </mat-form-field>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="3" (click)="submit()">
    <mat-icon>save</mat-icon>Lưu
  </button>
  <button mat-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>Bỏ qua
  </button>
</div>
