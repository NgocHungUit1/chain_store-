<h1 mat-dialog-title>Thêm bảng giá</h1>
<div mat-dialog-content>
  <form [formGroup]="formPriceList">
    <mat-form-field>
      <mat-label>Tên bảng giá</mat-label>
      <input matInput tabindex="1" [formControl]="this.formPriceList.controls['name']">
    </mat-form-field>
    </form>
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" [disabled]="this.formPriceList.invalid" tabindex="3" (click)="submit()"><mat-icon>save</mat-icon>Lưu</button>
  <button mat-button (click)="onNoClick()" tabindex="-1"><mat-icon>cancel</mat-icon>Bỏ qua</button>
</div>
