<div fxLayout="row">
  <div fxFlex="17">
    <mat-card class="price-list-info">
      <mat-card-title class="title-price-list">Bảng giá</mat-card-title>
      <mat-card-content>
        <form [formGroup]="priceListForm">
          <div fxLayout="row wrap">

            <div fxFlex="80">
              <mat-form-field>
                <mat-select placeholder="Chọn bảng giá" multiple formControlName="price_list_id">
                  <mat-option>--</mat-option>
                  <mat-option *ngFor="let priceList of priceLists" [value]="priceList.id">
                    {{priceList.name}}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <div fxFlex="20">
              <button mat-button aria-label="add" (click)="openCreatePriceListFormDialog()" >
                <mat-icon>add</mat-icon>
              </button>
            </div>

          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
  <div fxFlex="83">
    ádhaisd
  </div>
</div>
