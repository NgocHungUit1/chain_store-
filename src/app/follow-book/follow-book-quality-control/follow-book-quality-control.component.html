<mat-sidenav-container class='custom-filter-container'>
  <mat-sidenav #leftside id="leftside" position="left" class="left-sidebar" mode="side" opened="true">
    <mat-toolbar class="dv-header">
      <label class='custom-filter-container__title'>Kiểm soát chất lượng</label>
    </mat-toolbar>
    <div class='custom-filter-container__div-container'>
      <mat-accordion multi>
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>
              Thời gian
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>


        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>
              Loại chứng từ
            </mat-panel-title>
          </mat-expansion-panel-header>


        </mat-expansion-panel>
      </mat-accordion>
    </div>

  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="dv-header">
      <button mat-icon-button (click)="leftside.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span fxFlex="1 1 0%"></span>

      <button mat-raised-button color="primary" [matMenuTriggerFor]="createMenu" style="margin-right: 10px">
        <mat-icon>add</mat-icon>
        Tạo mới
      </button>
      <div class="diva-column-select">
        <button mat-raised-button color="primary" (click)="selectColumn.toggle();">
          <mat-icon>menu</mat-icon>
        </button>
        <mat-select [(ngModel)]="displayedColumns" #selectColumn [multiple]="true"
                    style="width: 100%; display: inline-flex; margin-left: -20px; color: white" placeholder="Chọn cột">
          <mat-option *ngFor="let column of columnsToDisplay" [value]="column">{{columnsHeader[column]}}</mat-option>
        </mat-select>
      </div>
      <button style="margin-left: 10px" mat-raised-button color="primary" (click)="loadData()">
        <mat-icon>refresh</mat-icon>
        Làm mới
      </button>
    </mat-toolbar>


  </mat-sidenav-content>
</mat-sidenav-container>
