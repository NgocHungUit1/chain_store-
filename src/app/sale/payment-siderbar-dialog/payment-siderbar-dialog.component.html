<h1 mat-dialog-title>Khách thanh toán</h1>
<div mat-dialog-content>
    <form [formGroup]="form">
        <div fxLayout="row wrap">
            <div fxFlex="100">
                <label>Số tiền</label>
                <mat-form-field style="text-align: right; font-size: 20px">
                    <input matInput type="number" tabindex="1" formControlName="number">
                </mat-form-field>
            </div>
        </div>
        <!-- <div fxLayout="row wrap" >
            <div fxFlex="100">
                <mat-radio-group tabindex="2" >
                    <mat-radio-button *ngFor=" let chooseNumber of chooseNumbers" [value]="chooseNumber"
                        (click)="add()" (mouseover)="add()" (mouseout)="add()">
                        {{ chooseNumber | number }}
                    </mat-radio-button>
                </mat-radio-group>
            </div>
        </div> -->
        <div fxLayout="row wrap">
            <div fxFlex="100" class="form-radio-field">
                <mat-radio-group tabindex="2" formControlName="type">
                    <mat-radio-button *ngFor=" let typeItem of typeItems" [value]="typeItem.id" (click)="updateEvent()"
                        (mouseover)="updateEvent()" (mouseout)="updateEvent()">
                        {{typeItem.title}}
                    </mat-radio-button>
                </mat-radio-group>
            </div>
        </div>

    </form>
</div>
<div mat-dialog-actions>
    <button mat-raised-button color="primary" tabindex="3" (click)="submit()">
        <mat-icon>save</mat-icon>Lưu
    </button>
    <button mat-button (click)="onNoClick()" tabindex="-1">
        <mat-icon>cancel</mat-icon>Bỏ qua
    </button>
</div>
