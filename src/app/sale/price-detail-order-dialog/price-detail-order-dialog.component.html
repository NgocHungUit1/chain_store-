<div mat-dialog-content>
  <form [formGroup]="form" class="mat-h3">

    <div fxLayout="row wrap">
      <mat-form-field>
        <mat-label>Gía Nhập</mat-label>
        <!-- <input matInput type="text" tabindex="1" formControlName="commonPriceDetailOrder" value="{{ commonPriceDetailOrderText | number }}"> -->
        <input matInput type="text" value="{{ product.original_price | number }}" disabled="true"
               style="color:black">
      </mat-form-field>
    </div>

    <div fxLayout="row wrap">
      <mat-form-field>
        <mat-label>Đơn giá</mat-label>
        <!-- <input matInput type="text" tabindex="1" formControlName="commonPriceDetailOrder" value="{{ commonPriceDetailOrderText | number }}"> -->
        <input matInput type="text" value="{{ commonPriceDetailOrderText | number }}" disabled="true"
               style="color:black">
      </mat-form-field>
    </div>

    <div fxLayout="row wrap">
      <div fxFlex="50">
        <mat-form-field>
          <mat-label>Giảm giá</mat-label>
          <input matInput type="number" tabindex="1" (keyup)="updateEvent()" formControlName="discountPriceDetailOrder">
        </mat-form-field>
      </div>
      <div fxFlex="50">
        <mat-radio-group tabindex="2" formControlName="discountTypePriceDetailOrder">
          <mat-radio-button *ngFor=" let typeItem of typeItems" [value]="typeItem.id" (click)="updateEvent()"
                            (mouseover)="updateEvent()"
                            (mouseout)="updateEvent()"
          >
            {{typeItem.title}}
          </mat-radio-button>
        </mat-radio-group>
      </div>
    </div>

    <div fxLayout="row wrap">
      <mat-form-field>
        <mat-label>Giá bán {{isVat ? '(Chưa VAT)' : ''}}</mat-label>
        <input matInput type="text" mask="separator" thousandSeparator=","  tabindex="1" formControlName="endPriceDetailOrder" (change)="onEndPriceChange()">
      </mat-form-field>
    </div>

    <div fxLayout="column" *ngIf="isVat" class="mat-h3">
      <mat-chip-list #chipList>
        <mat-chip *ngFor="let item of vatPercentOptions; index as i;"
                  [color]="form.controls['vatPercentSelect'].value == item.value ? 'primary' : ''"
                  [selected]="form.controls['vatPercentSelect'].value  == item.value"
                  [value]="item.value"
                  (click)="onChangeVatPercent(item.value)"
        >
          {{ item.name }}
        </mat-chip>

        <mat-chip (click)="onOpenAddNewVatPercentDialog()">
          <mat-icon>add</mat-icon>
        </mat-chip>
      </mat-chip-list>

      <div fxLayout="row wrap" style="margin-top: 16px;">
        <mat-form-field>
          <mat-label>Giá bán bao gồm VAT</mat-label>
          <input matInput  type="text" mask="separator" thousandSeparator="," formControlName="priceWithVat" (change)="onChangePriceWithVat()">
        </mat-form-field>
      </div>

    </div>


  </form>
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" tabindex="3" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
