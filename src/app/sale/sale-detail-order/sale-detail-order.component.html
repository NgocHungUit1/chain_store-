<div *ngFor="let itemProduct of listProduct; let i = index" class="product-item">
    <div fxLayout="row wrap" class="row-item">
        <div fxFlex="7" class="row-count-number">
            <span>{{  countProduct-i  }}</span>
            <button mat-icon-button (click)="deleleProduct(itemProduct)">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
        <div fxFlex="7" class="row-product-no">
            <span>
                {{ itemProduct.product?.product_no }}
            </span>
        </div>
        <div fxFlex="45">
            <span class="row-text row-product-name">
                {{ itemProduct.product?.product_name }}
            </span>
            <span class="row-product-note">
                <span *ngIf="itemProduct.product?.note_detail_sale === undefined">Ghi chú liều dùng</span>
                <span *ngIf="itemProduct.product?.note_detail_sale">{{ itemProduct.product?.note_detail_sale }}</span>
                <button mat-icon-button>
                    <mat-icon class="row-icon-edit"
                        (click)="openNoteDetailOrderDialog(itemProduct.product?.id, itemProduct.product?.note_detail_sale)">
                        edit</mat-icon>
                </button>
            </span>
        </div>
        <div fxFlex="10" class="row-amount">
            <div fxLayout="row wrap">
                <mat-form-field style=" font-size: 20px; text-align: center;">
                    <button matPrefix mat-icon-button class="row-button-edit-amount"
                        (click)="upAmountProduct(itemProduct.product?.id)">
                        <mat-icon>keyboard_arrow_up</mat-icon>
                    </button>
                    <input matInput type="number" tabindex="3" min="0" class="row-amount-number"
                        (input)="inputAmountProduct(itemProduct.product?.id,$event.target.value)"
                        value="{{ itemProduct.amount }}">
                    <button matSuffix mat-icon-button class="row-button-edit-amount"
                        (click)="downAmountProduct(itemProduct.product?.id)">
                        <mat-icon>keyboard_arrow_down</mat-icon>
                    </button>
                </mat-form-field>
            </div>
        </div>
        <div fxFlex="2"></div>
        <div fxFlex="12">
            <div fxLayout="row wrap">
                <div fxFlex="100">

                    <mat-form-field style=" font-size: 20px; text-align: right;"
                        *ngIf="itemProduct.product?.end_price === undefined">
                        <input matInput type="text" value="{{  itemProduct?.common_price | number }}" disabled="true"
                            style="color:black">
                        <button mat-icon-button matPrefix>
                            <mat-icon class="row-icon-edit-price"
                                (click)="openPriceDetailOrderDialog(itemProduct.product,itemProduct.common_price)">
                                edit</mat-icon>
                        </button>
                    </mat-form-field>

                    <mat-form-field style=" font-size: 20px; text-align: right;"
                        *ngIf="itemProduct.product?.end_price !== undefined">
                        <input matInput type="text" value="{{  itemProduct.product?.end_price | number }}"
                            disabled="true" style="color:black">
                        <button mat-icon-button matPrefix>
                            <mat-icon class="row-icon-edit-price"
                                (click)="openPriceDetailOrderDialog(itemProduct.product,itemProduct.common_price)">
                                edit</mat-icon>
                        </button>
                    </mat-form-field>

                </div>

            </div>

        </div>
        <div fxFlex="17" class="row-total-price">
            <span *ngIf="itemProduct.product?.end_price === undefined">
                {{ itemProduct?.common_price * itemProduct.amount | number }}
            </span>

            <span *ngIf="itemProduct.product?.end_price !== undefined">
                {{ itemProduct.product?.end_price * itemProduct.amount | number }}
            </span>
        </div>

    </div>

</div>
