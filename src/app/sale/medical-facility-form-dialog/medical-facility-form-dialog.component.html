<h1 mat-dialog-title>
  {{medical_facility_id ? 'Cập nhật' : 'Thêm' }} cơ sở y tế
</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Tên cơ sở</mat-label>
      <input matInput tabindex="1" [formControl]="this.form.controls['name']">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Số diện thoại</mat-label>
      <input matInput tabindex="1" [formControl]="this.form.controls['phone_number']">
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="3" (click)="submit()"><mat-icon>save</mat-icon>Lưu</button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1"><mat-icon>cancel</mat-icon>Bỏ qua</button>
</div>
