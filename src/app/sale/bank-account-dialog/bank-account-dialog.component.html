<div class="dialog-container">
  <div class="dialog-header">
    <div>
      <h2 style="margin: 0;" class ="mat-dialog-title">Thêm tài khoản</h2>
    </div>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <form [formGroup]="bankAccountForm" style="width: 100%">
      <h5>Thông tin tài khoản</h5>
      <div fxLayout="row wrap" class="input-layout" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Số tài khoản</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput formControlName="account_number" placeholder="Nhập số tài khoản"/>
          </mat-form-field>
        </div>
      </div>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Ngân hàng</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <mat-select formControlName="bank_code">
              <mat-option *ngFor="let code of bankCodes" [value]="code">
                {{this.bankCodesObj[code]}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Chủ tài khoản</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput formControlName="account_name" placeholder="Nhập tên chủ tài khoản"/>
          </mat-form-field>
        </div>
      </div>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Ghi chú</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <textarea matInput formControlName="note" placeholder="Nhập ghi chú"></textarea>
          </mat-form-field>
        </div>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button mat-button (click)="onCancel()" class="cancel-button">
      Bỏ qua
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSave()"
      [disabled]="bankAccountForm.invalid">
      Lưu
    </button>
  </div>
</div>
