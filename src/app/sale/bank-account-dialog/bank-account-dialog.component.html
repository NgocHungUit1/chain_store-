<div class="dialog-container">
  <div class="dialog-header">
    <div>
      <h2 style="margin: 0;" class ="mat-dialog-title">Thêm tài khoản</h2>
    </div>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <form [formGroup]="bankAccountForm" style="width: 100%">
      <h5>Thông tin tài khoản</h5>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Số tài khoản</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput formControlName="account_number" placeholder="Nhập số tài khoản"/>
          </mat-form-field>
        </div>
      </div>

      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Ngân hàng</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput type="text" placeholder="Tìm kiếm ngân hàng..."
                   [formControl]="bankSearchControl"
                   (input)="onSearchChange($event)">
          </mat-form-field>
          <mat-form-field class="full-width">
            <mat-select formControlName="bank_code" placeholder="Chọn ngân hàng">
              <mat-option *ngFor="let bank of filteredBanks" [value]="bank.code">
                <div class="bank-option">
                  <img [src]="bank.logo" [alt]="bank.shortName" class="bank-logo">
                  <span>{{bank.name}}</span>
                </div>
              </mat-option>
            </mat-select>
            <mat-spinner *ngIf="loading" diameter="20" class="loading-spinner"></mat-spinner>
          </mat-form-field>
        </div>
      </div>

      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Chủ tài khoản</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput formControlName="account_name" placeholder="Nhập tên chủ tài khoản"/>
          </mat-form-field>
        </div>
      </div>

      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Ghi chú</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <textarea rows="1" matInput formControlName="note" placeholder="Nhập ghi chú"></textarea>
          </mat-form-field>
        </div>
      </div>
    </form>
  </div>

  <div mat-dialog-actions align="end" class="dialog-actions">
    <button
      mat-raised-button
      color="primary"
      (click)="onSave()"
      [disabled]="bankAccountForm.invalid || loading">
      <mat-icon class="m-r-5">save</mat-icon>Lưu
    </button>
    <button mat-raised-button (click)="onCancel()" class="cancel-button">
      <mat-icon class="m-r-5">cancel</mat-icon>Bỏ qua
    </button>
  </div>
</div>
