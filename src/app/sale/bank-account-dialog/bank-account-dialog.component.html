<div class="dialog-container">
  <div class="dialog-header">
    <h2 class ="mat-dialog-title">Thêm tài khoản</h2>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <form [formGroup]="bankAccountForm" style="width: 100%">
      <h3>Thông tin tài khoản</h3>
      <div fxLayout="row wrap" class="input-layout" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Số tài khoản</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput formControlName="accountNumber" placeholder="Nhập số tài khoản"/>
          </mat-form-field>
        </div>
      </div>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Ngân hàng</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <mat-select formControlName="bankName">
              <mat-option value="Vietcombank">Vietcombank</mat-option>
              <mat-option value="BIDV">BIDV</mat-option>
              <mat-option value="Techcombank">Techcombank</mat-option>
              <mat-option value="VPBank">VPBank</mat-option>
              <mat-option value="MB Bank">MB Bank</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Chủ tài khoản</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <input matInput formControlName="accountHolder" placeholder="Nhập tên chủ tài khoản"/>
          </mat-form-field>
        </div>
      </div>
      <div fxLayout="row wrap" class="input-layout">
        <div fxFlex="30">
          <div class="bank-form--label">Ghi chú</div>
        </div>
        <div fxFlex="70">
          <mat-form-field class="full-width">
            <textarea matInput formControlName="note" placeholder="Nhập ghi chú"></textarea>
          </mat-form-field>
        </div>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button mat-button (click)="onCancel()" class="cancel-button">
      Bỏ qua
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSave()"
      [disabled]="bankAccountForm.invalid">
      Lưu
    </button>
  </div>
</div>
