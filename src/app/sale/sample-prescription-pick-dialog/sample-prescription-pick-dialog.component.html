<h2 mat-dialog-title style="margin-bottom: 8px;">
  <mat-icon style="vertical-align: middle; margin-right: 8px;">assignment</mat-icon>
  Đơn thuốc mẫu
</h2>

<mat-dialog-content style="max-height: 70vh;">
  <div fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="16px">
    <mat-form-field fxFlex>
      <mat-icon matPrefix style="margin-right: 6px;">search</mat-icon>
      <input matInput placeholder="Tìm theo mã hoặc tên đơn" autocomplete="off" cdkFocusInitial
             [ngModel]="keyword" (ngModelChange)="onKeywordChange($event)">
    </mat-form-field>
    <button mat-raised-button color="primary" type="button" (click)="sync()" [disabled]="syncing"
            matTooltip="Thêm các đơn thuốc mẫu chuẩn của hệ thống còn thiếu; thuốc chưa có sẽ tự tạo sản phẩm (tồn 0)">
      <mat-icon>sync</mat-icon>
      {{ syncing ? 'Đang đồng bộ...' : 'Đồng bộ đơn mẫu hệ thống' }}
    </button>
  </div>

  <table mat-table [dataSource]="rows" style="width: 100%;">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>Mã đơn</th>
      <td mat-cell *matCellDef="let row">{{ row.no }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Tên đơn</th>
      <td mat-cell *matCellDef="let row"><b>{{ row.name }}</b></td>
    </ng-container>
    <ng-container matColumnDef="total_amount">
      <th mat-header-cell *matHeaderCellDef style="text-align: right;">Giá</th>
      <td mat-cell *matCellDef="let row" style="text-align: right;">{{ row.total_amount | number }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="pick(row)" style="cursor: pointer;"></tr>
  </table>

  <p *ngIf="!loading && !rows.length" style="text-align: center; color: #757575; padding: 16px;">
    Chưa có đơn thuốc mẫu. Bấm "Đồng bộ đơn mẫu hệ thống" để lấy bộ đơn mẫu chuẩn.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Đóng</button>
</mat-dialog-actions>
