<div class="main-sale-siderbar-order">
    <form [formGroup]="form">

        <div class="user-action">
            <div fxLayout="row wrap">
                <div fxFlex="60">
                    <mat-form-field>
                        <input class="input-search-user" type="text" [formControl]="selectUser" matInput
                            [matAutocomplete]="chooseUser" placeholder="Tìm nhân viên ">
                        <button mat-button matPrefix>
                            <mat-icon>search</mat-icon>
                        </button>
                        <mat-autocomplete #chooseUser="matAutocomplete"
                            (optionSelected)="onSelectedUser($event.option.value)">
                            <mat-option *ngFor="let user of filteredUsers | async" [value]="user">
                                <span>{{user.username}}</span> |
                                <small>email: {{user.email}}</small>
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div fxFlex="2"></div>
                <div fxFlex="38">
                    <mat-form-field>
                        <input matInput value="{{ today | date:'medium' }}" disabled>
                    </mat-form-field>
                </div>
            </div>
        </div>

        <div class="customer-action">
            <div fxLayout="row wrap">
                <div fxFlex="70">
                    <mat-form-field>
                        <input class="input-search-customer" type="text" [formControl]="selectCustomer" matInput
                            [matAutocomplete]="chooseProduct" placeholder="Tìm khách hàng ">
                        <button mat-button matPrefix>
                            <mat-icon>search</mat-icon>
                        </button>
                        <mat-autocomplete #chooseProduct="matAutocomplete"
                            (optionSelected)="onSelectedCustomer($event.option.value)">
                            <mat-option *ngFor="let customer of filteredCustomers | async" [value]="customer">
                                <span>{{customer.name}}</span> |
                                <small>phone: {{customer.phone}}</small>
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div fxFlex="auto" >
                    <button mat-button matPrefix>
                        <mat-icon (click)="openSaleCustomerFormDialogComponent()">add</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <div class="pricebook-action">
            <mat-form-field>
                <button mat-button matPrefix>
                    <mat-icon>bookmark_border</mat-icon>
                </button>
                <mat-select placeholder="Chọn bảng giá" (selectionChange)="choosePriceBook($event)"
                    formControlName="priceBookID">
                    <mat-option *ngFor="let priceList of priceLists" [value]="priceList.id">
                        {{ priceList.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <label class="mat-h2"> Hóa đơn </label>
        <mat-divider></mat-divider>
        <div class="order-detail">
            <div fxLayout="row wrap" class="price-product">
                <div fxFlex="50" class="price-product-text ">
                    <span matBadge="{{ countProduct }}" matBadgeOverlap="false">Tổng tiền hàng </span>
                </div>
                <div fxFlex="50" class="price-product-number">
                    <input matInput type="text" value="{{ sumPrice | number}}">
                </div>
            </div>
        </div>

        <div class="order-discount">
            <div fxLayout="row wrap" class="price-discount">
                <div fxFlex="50" class="price-discount-text ">
                    <span>Giảm giá </span>
                </div>
                <div fxFlex="50" class="price-discount-number">
                    <mat-form-field style="text-align: right">
                        <button mat-icon-button matPrefix>
                            <mat-icon class="row-edit-price-discount-number" (click)="openDiscountSiderBar()">edit
                            </mat-icon>
                        </button>
                        <input matInput type="text" value="{{ numberDiscount | number}}" [disabled]="true"
                            style="color:black">
                    </mat-form-field>
                </div>
            </div>
        </div>

        <div class="customer-need">
            <div fxLayout="row wrap" class="customer-need">
                <div fxFlex="50" class="customer-need-text label-text">
                    <span>Khách cần trả</span>
                </div>
                <div fxFlex="50" class="customer-need-number">
                    <input matInput type="text" value="{{ sumPrice - numberDiscount | number}}">
                </div>
            </div>
        </div>

        <div class="customer-pay">
            <div fxLayout="row wrap" class="customer-pay">
                <div fxFlex="50" class="customer-pay-text ">
                    <span>Khách thanh toán</span>
                </div>
                <div fxFlex="50" class="customer-pay-number">
                    <mat-form-field style="text-align: right">
                        <button mat-icon-button matPrefix>
                            <mat-icon class="row-edit-customer-pay-number" (click)="openPaymentSiderBarDialog()">
                                credit_card</mat-icon>
                        </button>
                        <input matInput type="text" value="{{ customerPay | number}}" [disabled]="true"
                            style="color:black">
                    </mat-form-field>
                </div>
            </div>
        </div>

        <div class="excess-cash">
            <div fxLayout="row wrap" class="excess-cash">
                <div fxFlex="50" class="cexcess-cash-text label-text">
                    <span>Tiền thừa trả khách</span>
                </div>
                <div fxFlex="50" class="excess-cash-number">
                    <input matInput type="text" *ngIf="customerPay - sumPrice + numberDiscount > 0"
                        value="{{ customerPay - sumPrice + numberDiscount | number}}">
                    <input matInput type="text" *ngIf="customerPay - sumPrice + numberDiscount <= 0" value="0">
                </div>
            </div>
        </div>

        <div class="order-note">
            <mat-form-field class="example-full-width">
                <mat-label>Ghi chú</mat-label>
                <textarea matInput placeholder="" formControlName="noteSiderBar" (keyup)="saveNoteSiderBar($event)"></textarea>
            </mat-form-field>
        </div>
        <button mat-button class="payment-button btn-success" (click)="payment()">
            <span>Thanh toán</span>
        </button>

        <span class="support-content">
            <mat-icon>phone</mat-icon> Hỗ trợ khách hàng 1900 6522
        </span>

    </form>

</div>
