<h1 mat-dialog-title>Thêm nhà cung cấp</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <div fxLayout="row wrap">
      <div fxFlex="50">
        <div fxLayout="row wrap">
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Tên nhà cung cấp</mat-label>
              <input matInput tabindex="1" formControlName="name">
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Điện thoại</mat-label>
              <input matInput tabindex="2" formControlName="phone_number">
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Địa chỉ</mat-label>
              <textarea matInput tabindex="3" formControlName="address" rows="2"></textarea>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <input matInput placeholder="Tỉnh/Thành phố" tabindex="4" aria-label="Tỉnh/Thành phố" [matAutocomplete]="province" formControlName="province">
              <mat-autocomplete #province="matAutocomplete" [displayWith]="displayLocation" (optionSelected)='onProvinceChange($event.option.value)'>
                <mat-option *ngFor="let province of filteredProvinces | async" [value]="province">
                  <span>{{province.name}}</span>
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <input matInput placeholder="Quận/Huyện" tabindex="4" aria-label="Quận/Huyện" [matAutocomplete]="district" formControlName="district">
              <mat-autocomplete #district="matAutocomplete" [displayWith]="displayLocation" (optionSelected)='onDistrictChange($event.option.value)'>
                <mat-option *ngFor="let district of filteredDistricts | async" [value]="district">
                  <span>{{district.name}}</span>
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <input matInput placeholder="Phường/Xã" tabindex="4" aria-label="Phường/Xã" [matAutocomplete]="ward" formControlName="ward">
              <mat-autocomplete #ward="matAutocomplete" [displayWith]="displayLocation">
                <mat-option *ngFor="let ward of filteredWards | async" [value]="ward">
                  <span>{{ward.name}}</span>
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div fxFlex="50">
        <div fxLayout="row wrap">
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Email</mat-label>
              <input matInput tabindex="7" formControlName="email">
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Công ty</mat-label>
              <input matInput tabindex="8" formControlName="company_name">
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Ghi chú</mat-label>
              <textarea matInput tabindex="9" formControlName="note" rows="2"></textarea>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Mã số thuế</mat-label>
              <input matInput tabindex="10" formControlName="tax_code">
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>

  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="3" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
