<h1 mat-dialog-title>Thêm nhà cung cấp</h1>
<div mat-dialog-content>
  <form [formGroup]="form">
    <div fxLayout="row wrap">
      <div fxFlex="49">
        <div fxLayout="row wrap">
          <div fxFlex="100">
            <div fxLayout="row" fxLayoutAlign="start center">
              <mat-form-field fxFlex="75">
                <mat-label>Mã số thuế</mat-label>
                <input matInput tabindex="1" formControlName="tax_code">
              </mat-form-field>
              <button mat-raised-button color="primary" type="button" fxFlex="25" class="m-l-10" (click)="lookupBusinessInfo()">
                <mat-icon>search</mat-icon> Tra cứu
              </button>
            </div>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Tên nhà cung cấp</mat-label>
              <input matInput tabindex="2" formControlName="name" required>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Điện thoại</mat-label>
              <input matInput tabindex="3" formControlName="phone_number" required>
              <mat-error *ngIf="form.controls['phone_number'].hasError('required')">Số điện thoại không được để trống</mat-error>
              <mat-error *ngIf="form.controls['phone_number'].hasError('pattern')">Số điện thoại không hợp lệ (VD: 0xxxxxxxxx hoặc +84xxxxxxxxx)</mat-error>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Địa chỉ</mat-label>
              <textarea matInput tabindex="4" formControlName="address" rows="2"></textarea>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <input matInput placeholder="Tỉnh/Thành phố" tabindex="5" aria-label="Tỉnh/Thành phố"
                     [matAutocomplete]="province" formControlName="province"
                     (focus)="provinceFocus$.next('')">
              <mat-autocomplete #province="matAutocomplete" [displayWith]="displayLocation"
                                (optionSelected)='onProvinceChange($event.option.value)'>
                <mat-option *ngFor="let province of filteredProvinces | async" [value]="province">
                  <span>{{province.name}}</span>
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <input matInput placeholder="Phường/Xã" tabindex="7" aria-label="Phường/Xã" [matAutocomplete]="ward"
                     formControlName="ward"
                     (focus)="wardFocus$.next('')">
              <mat-autocomplete #ward="matAutocomplete" [displayWith]="displayLocation">
                <mat-option *ngFor="let ward of filteredWards | async" [value]="ward">
                  <span>{{ward.name}}</span>
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div fxFlex="2"></div>
      <div fxFlex="49">
        <div fxLayout="row wrap">
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Email</mat-label>
              <input matInput tabindex="8" formControlName="email">
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Công ty</mat-label>
              <input matInput tabindex="9" formControlName="company_name">
            </mat-form-field>
          </div>
          <div fxFlex="100">
            <mat-form-field>
              <mat-label>Ghi chú</mat-label>
              <textarea matInput tabindex="10" formControlName="note" rows="2"></textarea>
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>

  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="11" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
