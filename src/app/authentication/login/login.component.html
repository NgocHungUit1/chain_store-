<div class="login-register" style="background-image:url(assets/images/big/img2.jpg);">
  <div class="login-register-box">
    <mat-card>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="text-center">
            <img alt="homepage" src="{{logo}}" style="max-width: 192px; max-height: 192px;">
            <h4 class="m-t-0">Đăng nhập vào hệ thống</h4>
          </div>

          <div fxLayout="row wrap">
            <!-- col full-->
            <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
              <mat-form-field>
                <input matInput placeholder="Tài khoản" [formControl]="form.controls['uname']">
              </mat-form-field>
              <small *ngIf="form.controls['uname'].hasError('required') && form.controls['uname'].touched"
                     class="text-danger support-text">Vui lòng điền tài khoản.
              </small>
            </div>
            <!-- col full-->
            <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
              <mat-form-field>
                <input matInput type="password" placeholder="Mật khẩu" [formControl]="form.controls['password']">
              </mat-form-field>
              <small *ngIf="form.controls['password'].hasError('required') && form.controls['password'].touched"
                     class="text-danger support-text">Vui lòng điền mật khẩu.
              </small>
              <small class="text-danger support-text" *ngIf="wrong">{{wrongMessage}}</small>
            </div>
            <!-- col half-->
            <div fxFlex.gt-sm="50" fxFlex.gt-xs="50">
              <mat-checkbox color="warn">Giữ đăng nhập.</mat-checkbox>
            </div>
            <!-- col half-->
            <div fxFlex.gt-sm="50" fxFlex.gt-xs="50" class="text-right">
              <a [routerLink]="['/authentication/forgot']" class="link">Quên mật khẩu?</a>
            </div>
            <!-- col full-->
            <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
              <button mat-raised-button color="primary" class="btn-block btn-lg m-t-20 m-b-20" type="submit"
                      [disabled]="!form.valid">Đăng nhập
              </button>
            </div>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
