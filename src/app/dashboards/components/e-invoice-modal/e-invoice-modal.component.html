<div class="e-invoice-modal">
  <div class="modal-header">
    <button class="close-button" (click)="dialogRef.close()">
      <span>×</span>
    </button>
  </div>

  <div class="modal-body" (click)="openRegisterModal()">
    <div class="content">
      <img src="assets/images/einvoice/einvoice.png" alt="E-Invoice" class="main-image">
    </div>
  </div>

  <div class="modal-footer">
    <label>
      <input type="checkbox" [(ngModel)]="dontShowAgain" />
      Không hiển thị thông báo này nữa
    </label>
    <button (click)="onCloseClick($event)">Đóng</button>
  </div>
</div>
