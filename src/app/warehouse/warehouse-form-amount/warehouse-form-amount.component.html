<div mat-dialog-content>
  <form [formGroup]="form">

    <mat-label style="font-size: 16px">Thành tiền</mat-label>
    <div fxLayout="row wrap" class="row-wrap">
      <div fxFlex="auto">
        <mat-form-field style="text-align: right; font-size: 16px">
          <input readonly matInput tabindex="1" formControlName="amount" type="text" min="0" autocomplete="off">
        </mat-form-field>
      </div>
    </div>

    <mat-label style="font-size: 16px">Thành tiền mới</mat-label>
    <div fxLayout="row wrap" class="row-wrap">
      <div fxFlex="auto">
        <mat-form-field style="text-align: right; font-size: 16px">
          <input matInput  tabindex="1" formControlName="final_amount" type="text" min="0" autocomplete="off">
        </mat-form-field>
      </div>
    </div>

  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" tabindex="3" (click)="submit()">
    <mat-icon>save</mat-icon>Lưu
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>Bỏ qua
  </button>
</div>
