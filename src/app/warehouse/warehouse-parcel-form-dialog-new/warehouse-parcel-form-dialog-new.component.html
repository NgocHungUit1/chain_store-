<h2 mat-dialog-title>Thêm mới lô cho {{data['product_no']}}</h2>

<form [formGroup]="parcelForm" (ngSubmit)="onSave()">
  <mat-dialog-content style="overflow: visible">
    <div fxLayout="column" fxLayoutGap="20px">
      <div fxFlex="100">
        <mat-form-field  fxFill>
          <mat-label>Mã lô <span style="color: red">*</span></mat-label>
          <input matInput
                 formControlName="parcel_no"
                 placeholder="Nhập mã lô">
          <mat-error class="field-error" *ngIf="parcelForm.get('parcel_no')?.invalid && parcelForm.get('parcel_no')?.touched">
            Mã lô là bắt buộc
          </mat-error>
        </mat-form-field>
      </div>

      <div fxFlex="100">
        <mat-form-field  fxFill>
          <mat-label>Hạn sử dụng <span style="color: red">*</span></mat-label>
          <input matInput
                 [matDatepicker]="picker"
                 formControlName="expiration_date">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error class="field-error" *ngIf="parcelForm.get('expiration_date')?.errors?.required">
            Hạn sử dụng là bắt buộc
          </mat-error>
        </mat-form-field>
      </div>

      <div fxFlex="100" class="quantity_parcel">
        <mat-form-field  fxFill>
          <mat-label>Số lượng <span style="color: red">*</span></mat-label>
          <input matInput
                 type="number"
                 formControlName="quantity"
                 placeholder="Nhập số lượng">
          <mat-error *ngIf="parcelForm.get('quantity')?.invalid && parcelForm.get('quantity')?.touched">
            <span *ngIf="parcelForm.get('quantity')?.errors?.required">Số lượng là bắt buộc</span>
            <span *ngIf="parcelForm.get('quantity')?.errors?.min">Số lượng phải lớn hơn 0</span>
          </mat-error>
        </mat-form-field>
      </div>

      <div fxFlex="100">
        <mat-form-field fxFill>
          <mat-label>Giá nhập (đơn giá)</mat-label>
          <input matInput
                 type="number"
                 formControlName="unit_cost"
                 placeholder="Nhập đơn giá theo lô">
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" fxLayoutGap="8px">
    <button mat-raised-button
            color="primary"
            type="submit"
            [disabled]="parcelForm.invalid">
      <mat-icon>save</mat-icon> Thêm
    </button>
    <button mat-raised-button
            type="button"
            (click)="onNoClick()">
      <mat-icon>cancel</mat-icon> Hủy
    </button>
  </mat-dialog-actions>
</form>
