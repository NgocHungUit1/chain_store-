<h2 mat-dialog-title>{{data['parcel_no']}} - {{data['expiration_date']| date: 'dd/MM/yyyy'}}</h2>
<mat-dialog-content style="overflow: visible">
  <div fxLayout="column" fxLayoutGap="20px">
    <div fxFlex="100">
      <mat-form-field fxFill>
        <mat-label>Mã lô</mat-label>
        <input disabled
               matInput
               [(ngModel)]="data['parcel_no']">
      </mat-form-field>
    </div>

    <div fxFlex="100">
      <mat-form-field fxFill>
        <mat-label>Hạn sử dụng</mat-label>
        <input disabled
               matInput
               [matDatepicker]="picker"
               [(ngModel)]="data['expiration_date']">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <div fxFlex="100">
      <mat-form-field fxFill>
        <mat-label>Tồn</mat-label>
        <input disabled
               matInput
               type="number"
               [(ngModel)]="data['quantity_of_stock']">
      </mat-form-field>
    </div>

    <div fxFlex="100" class="quantity_parcel">
      <mat-form-field  fxFill>
        <mat-label>Số lượng</mat-label>
        <input matInput
               type="number"
               tabindex="3"
               autocomplete="off"
               placeholder="Nhập số lượng"
               min="1"
               required
               #quantityInput="ngModel"
               [(ngModel)]="data['quantity']"
               name="quantity">
        <mat-error *ngIf="quantityInput.invalid">
          <span *ngIf="quantityInput.errors?.required">Số lượng là bắt buộc</span>
          <span *ngIf="quantityInput.errors?.min">Số lượng phải lớn hơn 0</span>
        </mat-error>
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" fxLayoutGap="8px">
  <button mat-raised-button
          [mat-dialog-close]="data"
          color="primary"
          tabindex="4"
          [disabled]="quantityInput.invalid">
    <mat-icon>save</mat-icon> Thêm
  </button>
  <button mat-raised-button
          (click)="onNoClick()">
    <mat-icon>cancel</mat-icon> Hủy
  </button>
</mat-dialog-actions>
