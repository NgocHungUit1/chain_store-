<h1 mat-dialog-title>Danh sách lô nhập
<!--  <button (click)="newParcel()" mat-mini-fab color="primary" aria-label="Example icon button with a filter list icon">-->
<!--    <mat-icon>add</mat-icon>-->
<!--  </button>-->
</h1>

<div class="table-loading-shade" *ngIf="isLoadingResults || isRateLimitReached">
  <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
  <div class="table-rate-limit-reached" *ngIf="isRateLimitReached">
    GitHub's API rate limit has been reached. It will be reset in one minute.
  </div>
</div>

<table mat-table [dataSource]="parcels" class="mat-elevation-z8">


  <ng-container matColumnDef="parcel_no">
    <th mat-header-cell *matHeaderCellDef>Số lô</th>
    <td mat-cell *matCellDef="let element" style='width: 30%'>
      <mat-form-field>
        <input matInput tabindex="1" [(ngModel)]="element.parcel_no" autocomplete="off">
      </mat-form-field>
    </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="expiration_date">
    <th mat-header-cell *matHeaderCellDef>Hạn sử dụng</th>
    <td mat-cell *matCellDef="let element" style='width: 30%'>
      <!--      {{element.expiration_date}}-->

      <mat-form-field>
        <input matInput tabindex="2" [matDatepicker]="date_picker" [(ngModel)]="element.expiration_date"
               placeholder="Hạn sử dụng">
        <mat-datepicker-toggle matSuffix [for]="date_picker"></mat-datepicker-toggle>
        <mat-datepicker #date_picker></mat-datepicker>
      </mat-form-field>
    </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef style='text-align: left!important;'>Số lượng</th>
    <td mat-cell *matCellDef="let element" style='width: 30%'>
      <mat-form-field class="text-right">
        <input matInput [(ngModel)]="element.quantity" min="1" (keyup)="inputformatNumber($event)">
      </mat-form-field>
    </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div mat-dialog-actions align="end">

  <button mat-raised-button color="primary" tabindex="4" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>

  <!--  <button mat-raised-button (click)="onNoClick()" tabindex="-1">-->
  <!--    <mat-icon>cancel</mat-icon>-->
  <!--    Bỏ qua-->
  <!--  </button>-->
</div>
