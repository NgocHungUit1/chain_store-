<h1 mat-dialog-title>Danh sách lô nhập</h1>
<table mat-table [dataSource]="changes" class="mat-elevation-z8">


  <ng-container matColumnDef="parcel_no">
    <th mat-header-cell *matHeaderCellDef>Số lô</th>
    <td mat-cell *matCellDef="let element"> {{element.parcel_no}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="expiration_date">
    <th mat-header-cell *matHeaderCellDef>Hạn sử dụng</th>
    <td mat-cell *matCellDef="let element">
      <!--      {{element.expiration_date}}-->

      <mat-form-field>
        <input matInput tabindex="2" [matDatepicker]="date_picker" [(ngModel)]="element.expiration_date"
               placeholder="Hạn sử dụng">
        <mat-datepicker-toggle matSuffix [for]="date_picker"></mat-datepicker-toggle>
        <mat-datepicker #date_picker></mat-datepicker>
      </mat-form-field>
    </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef>Số lượng</th>
    <td mat-cell *matCellDef="let element">
      <mat-form-field style="width: 100px" class="text-right">
        <input matInput [(ngModel)]="element.quantity" min="1" (keyup)="inputformatNumber($event)">
      </mat-form-field>
    </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div mat-dialog-actions align="end">

  <button mat-raised-button color="primary" tabindex="4" (click)="submit()">
    <mat-icon>save</mat-icon>
    Lưu
  </button>

<!--  <button mat-raised-button (click)="onNoClick()" tabindex="-1">-->
<!--    <mat-icon>cancel</mat-icon>-->
<!--    Bỏ qua-->
<!--  </button>-->
</div>
