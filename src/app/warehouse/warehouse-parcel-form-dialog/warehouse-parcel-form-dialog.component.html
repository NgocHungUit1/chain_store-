<h1 mat-dialog-title>Thêm Lô</h1>
<div mat-dialog-content>
  <form [formGroup]="form" style="font-size: 14px;">
    <mat-form-field>
      <input matInput tabindex="1" placeholder="Số Lô" [formControl]="this.form.controls['parcel_no']" autocomplete="off">
    </mat-form-field>
    <mat-form-field>
      <input matInput tabindex="2" [matDatepicker]="date_picker" [formControl]="form.controls['expiration_date']"
             placeholder="Hạn sử dụng">
      <mat-datepicker-toggle matSuffix [for]="date_picker"></mat-datepicker-toggle>
      <mat-datepicker #date_picker></mat-datepicker>
    </mat-form-field>
    <mat-form-field>
      <input matInput tabindex="3" type="number" placeholder="Số lượng hàng hóa trong lô" min="1"
             [formControl]="this.form.controls['quantity']" autocomplete="off">
    </mat-form-field>

    <button mat-button  *ngIf="parcelRecommend" (click)="chooseParcel()" style="border: 1px solid;">
      Lô đã lưu trước đó : {{ parcelRecommend?.parcel_no }}
    </button>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="4" (click)="submit()">
    <mat-icon>save</mat-icon>
    Ok
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    <mat-icon>cancel</mat-icon>
    Bỏ qua
  </button>
</div>
