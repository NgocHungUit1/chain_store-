<h2 mat-dialog-title>Load dữ liệu hóa đơn</h2>

<form [formGroup]="loadForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-container">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Mã số thuế</mat-label>
        <input matInput formControlName="MST" required>
        <mat-error *ngIf="loadForm.get('MST').hasError('required')">
          Vui lòng nhập mã số thuế
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Thời gian cập nhật</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="LastUpdate" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="loadForm.get('LastUpdate').hasError('required')">
          Vui lòng chọn thời gian
        </mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <div style="display:flex; gap:12px;">
      <button mat-button type="button" (click)="onCancel()">Hủy</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!loadForm.valid">
        <mat-icon>cloud_download</mat-icon>
        Load dữ liệu
      </button>
      <button mat-flat-button color="accent" [disabled]="!loadForm.valid" (click)="exportExcel()">
        <mat-icon>file_download</mat-icon>
        Xuất dữ liệu
      </button>
    </div>
  </mat-dialog-actions>
</form>
