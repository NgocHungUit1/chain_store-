<h2 mat-dialog-title>Đồng bộ hóa đơn điện tử</h2>

<div mat-dialog-content>
  <form [formGroup]="syncForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Username</mat-label>
          <input matInput formControlName="Username" required>
          <mat-error *ngIf="syncForm.get('Username').errors?.required">
            Vui lòng nhập Username
          </mat-error>
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="Password" required>
          <mat-error *ngIf="syncForm.get('Password').errors?.required">
            Vui lòng nhập Password
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Từ ngày</mat-label>
          <input matInput [matDatepicker]="fromPicker" formControlName="FromInvoiceDate" required>
          <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
          <mat-datepicker #fromPicker></mat-datepicker>
          <mat-error *ngIf="syncForm.get('FromInvoiceDate').errors?.required">
            Vui lòng chọn ngày bắt đầu
          </mat-error>
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Đến ngày</mat-label>
          <input matInput [matDatepicker]="toPicker" formControlName="ToInvoiceDate" required>
          <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
          <mat-datepicker #toPicker></mat-datepicker>
          <mat-error *ngIf="syncForm.get('ToInvoiceDate').errors?.required">
            Vui lòng chọn ngày kết thúc
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button mat-button type="button" (click)="onCancel()" [disabled]="loading">Hủy</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="loading || syncForm.invalid">
        <mat-icon>sync</mat-icon>
        <span *ngIf="!loading">Đồng bộ</span>
        <span *ngIf="loading">Đang đồng bộ...</span>
      </button>
    </div>
  </form>
</div>
