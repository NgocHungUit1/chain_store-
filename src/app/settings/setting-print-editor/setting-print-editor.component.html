<div class="editor-container">
<!--  <button (click)="toggleEditMode()" class="toggle-mode-btn">-->
<!--    {{ isEditMode ? 'Switch to View Mode' : 'Switch to Edit Mode' }}-->
<!--  </button>-->
  <div class="editor-header" fxLayout="row" fxLayout.xs="column" fxLayout.sm="column" fxLayoutAlign="space-between center" fxLayoutAlign.xs="center center" class="header-gap">
    <div class="template-select" fxFlex.xs="100">
    <span>Mẫu in</span>
    <mat-form-field appearance="fill" style="width: 200px; display: inline-block;">
        <mat-select [(value)]="selectedTemplateId" (selectionChange)="onChangeInvoiceTemplate($event)">
          <mat-option *ngFor="let template of invoiceTemplates" [value]="template.id">
            {{ template.name }}
          </mat-option>
        </mat-select>

    </mat-form-field>
    </div>
    <div fxFlex.xs="100" fxLayoutAlign.xs="center center">
    <button mat-icon-button (click)="onEdit()">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button (click)="onAdd()">
      <mat-icon>add</mat-icon>
    </button>
    </div>
  </div>
  <div fxLayout="row" fxLayout.xs="column" fxLayout.sm="column" class="main-content-gap">
    <!-- Editor section sử dụng SharedEditorComponent -->
    <div class="editor-section" fxFlex="50" fxFlex.xs="100" fxFlex.sm="100">
      <app-shared-editor
        [config]="editorConfig"
        [templateData]="templateData"
        >
      </app-shared-editor>
    </div>

    <div class="preview-section" fxFlex="50" fxFlex.xs="100" fxFlex.sm="100">
      <p fxLayoutAlign="end center">Xem trước mẫu in</p>
      <div id="preview-container" class="desktop-view">
        <div id="preview-content-main"></div>
      </div>
    </div>
  </div>
</div>
