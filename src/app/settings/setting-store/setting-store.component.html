
<div class="dv-content">
  <mat-card class="mat-card-top ">
    <mat-sidenav-container
      [ngClass]="{ 'side-panel-opened': sidePanelOpened, 'side-panel-closed': !sidePanelOpened }">
      <mat-sidenav #noteslist [mode]="isOver() ? 'over' : 'side'" [opened]="!isOver()" (open)="sidePanelOpened = true"
                   (close)="sidePanelOpened = false">
        <app-setting-sidenav></app-setting-sidenav>
      </mat-sidenav>

      <mat-toolbar class="no-shadow">
        <div fxLayout="row" fxFlex="100" fxLayoutAlign="center center">
          <button (click)="noteslist.toggle()" class="mr-1" mat-icon-button>
            <mat-icon>short_text</mat-icon>
          </button>
          <h4 class="setting-title">Thông tin cửa hàng</h4>
          <span fxFlex="1 1 0%"></span>
        </div>
      </mat-toolbar>
      <mat-card-content class="chat-middle-box">
        <form [formGroup]="form">
          <div fxLayout="row wrap">
            <div fxFlex="100">
              <div fxLayout="row wrap">

                <div fxFlex="100">
                  <mat-form-field>
                    <mat-label>Loại hợp đồng</mat-label>
                    <input matInput tabindex="1" formControlName="pricing_plan_id" [value]="pricingPlan[this.form.controls['pricing_plan_id'].value]">
                  </mat-form-field>
                </div>

                <div fxFlex="100">
                  <mat-form-field>
                    <mat-label>Ngày tạo</mat-label>
                    <input matInput tabindex="2" formControlName="created_at" [value]="this.form.controls['created_at'].value * 1000 | date:'dd/MM/yyyy'">
                  </mat-form-field>
                </div>

                <div fxFlex="100">
                  <mat-form-field>
                    <mat-label>Ngày hết hạn</mat-label>
                    <input matInput tabindex="4" formControlName="expiration_date" [value]="this.form.controls['expiration_date'].value | date:'dd/MM/yyyy'">
                  </mat-form-field>
                </div>

                <div fxFlex="100">
                  <mat-form-field>
                    <mat-label>Mã cơ sở</mat-label>
                    <input matInput tabindex="5" formControlName="registration_no" [value]="this.form.controls['registration_no'].value">
                  </mat-form-field>
                </div>

                <div fxFlex="100">
                  <mat-form-field>
                    <mat-label>Tài khoản kết nối</mat-label>
                    <input matInput tabindex="6" formControlName="nation_username" [value]="this.form.controls['nation_username'].value">
                  </mat-form-field>
                </div>

                <div fxFlex="100">
                  <mat-form-field>
                    <mat-label>Mật khẩu kết nối</mat-label>
                    <input matInput tabindex="7" formControlName="nation_password" [value]="this.form.controls['nation_password'].value">
                  </mat-form-field>
                </div>


<!--                <button mat-raised-button color="primary" [disabled]="this.form.invalid" tabindex="6" (click)="submit()">-->
<!--                  <mat-icon>save</mat-icon>-->
<!--                  Lưu-->
<!--                </button>-->

              </div>
            </div>

          </div>

        </form>
      </mat-card-content>
    </mat-sidenav-container>
  </mat-card>
</div>
