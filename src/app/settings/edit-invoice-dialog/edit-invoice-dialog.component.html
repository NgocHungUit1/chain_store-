<h2 mat-dialog-title style="display: flex; align-items: center; ">
  <span>{{ header }}</span>
  <button mat-icon-button (click)="toggleVariablesInfo()" matTooltip="Show variable info">
    <i class="fa fa-info-circle"></i>
  </button>
</h2>
<div mat-dialog-content class="dialog-content">
  <div *ngIf="showVariablesInfo" class="variables-info">
    <h4 style="margin: 0">Danh sách các biến thay thế</h4>
    <table class="variables-table">
      <tr *ngFor="let row of variableRows">
        <td style="font-weight: 700;">{{ '{' + row.first.name + '}' }}</td>
        <td>{{ row.first.meaning }}</td>
        <td style="font-weight: 700;" *ngIf="row.second">{{ '{' + row.second.name + '}' }}</td>
        <td *ngIf="row.second">{{ row.second.meaning }}</td>
      </tr>
    </table>
  </div>
  <div *ngIf="!showVariablesInfo" fxLayout="row" fxLayout.xs="column" fxLayout.sm="column" fxGap="16px" class="editor-container">
    <!-- Editor section sử dụng shared component -->
    <div fxFlex="50" fxFlex.xs="100" fxFlex.sm="100" class="editor-section">
      <div fxLayout="row" fxLayoutAlign="space-between center" class="template-name-section">
        <!-- Template name section -->
        <div fxFlex="48">
          <div fxLayout="row" fxLayoutAlign="space-between center">
            <div fxFlex="30">
              <span class="field-label">Tên mẫu in</span>
            </div>
            <div fxFlex="65" class="template-name-input">
              <mat-form-field appearance="outline" class="full-width">
                <input
                  matInput
                  type="text"
                  [(ngModel)]="template.name"
                  autocomplete="off"
                  placeholder="Nhập tên mẫu in" />
              </mat-form-field>
            </div>
          </div>
        </div>

        <!-- Template suggestion section -->
        <div fxFlex="48">
          <div fxLayout="row" fxLayoutAlign="space-between center">
            <div fxFlex="30">
              <span class="field-label">Mẫu in gợi ý</span>
            </div>
            <div fxFlex="65" class="template-name-input">
              <mat-form-field appearance="outline" class="full-width">
                <mat-select [(value)]="selectedTemplateId"
                            (selectionChange)="onChangeInvoiceTemplate($event)"
                            placeholder="-- Chọn mẫu gợi ý --">
                  <mat-option *ngFor="let suggestTemplate of suggestInvoiceTemplates"
                              [value]="suggestTemplate.id">
                    {{ suggestTemplate.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
      <app-shared-editor
        [config]="editorConfig"
        [templateData]="templateData"
        (contentChanged)="onContentChanged($event)"
        (dataChanged)="onDataChanged($event)">
      </app-shared-editor>
    </div>

    <!-- Preview section -->
    <div fxFlex="50" fxFlex.xs="100" fxFlex.sm="100" class="preview-section">
      <p fxLayoutAlign="end center">Xem trước mẫu in</p>
      <div id="preview-container" class="desktop-view">
        <div id="preview-content-popup" ></div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!showVariablesInfo"  mat-dialog-actions align="end">
  <!-- Standard action buttons -->
  <button mat-raised-button (click)="onClose()"><mat-icon>cancel</mat-icon>
    Hủy</button>

  <button mat-raised-button color="warn" *ngIf="isEditMode" (click)="onDelete()"><mat-icon>delete</mat-icon> Xóa</button>
  <button
    mat-raised-button
    color="primary"
    (click)="onSave()">
    <mat-icon>save</mat-icon>
    {{ isEditMode ? 'Cập nhật' : 'Tạo mới' }}
  </button>

</div>
